name: Publish Extension

# Publish by pushing a tag:  git tag v0.0.9 && git push origin v0.0.9
# The tag decides the version, so package.json can never disagree with it.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest   # one cheap, always-available runner builds every platform
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, linux-arm64, win32-x64, win32-arm64, darwin-x64, darwin-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: yarn install --immutable

      - name: Use the tag as the version (v1.2.3 -> 1.2.3)
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # esbuild is a native binary that differs per OS/CPU. We build every platform on Linux
      # by swapping in the matching binary before packaging.
      - name: Use esbuild binary for ${{ matrix.target }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./node_modules/esbuild/package.json').version")
          rm -rf node_modules/@esbuild
          mkdir -p "node_modules/@esbuild/${{ matrix.target }}"
          cd "$RUNNER_TEMP"
          npm pack "@esbuild/${{ matrix.target }}@${VERSION}" --silent
          tar -xzf esbuild-*.tgz -C "$GITHUB_WORKSPACE/node_modules/@esbuild/${{ matrix.target }}" --strip-components=1

      - name: Publish ${{ matrix.target }}
        run: npx @vscode/vsce publish --no-yarn --target ${{ matrix.target }} --skip-duplicate --oidc
